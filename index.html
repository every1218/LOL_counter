        function filterCountersByLine(countersList, selectedLine) {
            if (!countersList || !countersList.length) return [];
            if (!selectedLine || selectedLine === '전체') {
                return countersList;
            }

            if (currentChampData && currentChampData.lines && currentChampData.lines.length === 1) {
                return countersList;
            }

            return countersList.filter(function (item) {
                var rawName = (typeof item === 'string') ? item : (item.name || '');
                var parsed = getLineTagInfo(rawName);
                var tags = parsed.lineTags || [];

                if (!tags.length || tags.indexOf('기타') !== -1) {
                    return true;
                }

                var isBotFilter = (selectedLine === '원딜' || selectedLine === '바텀' || selectedLine === '서폿' || selectedLine === '서포터');

                for (var i = 0; i < tags.length; i++) {
                    var tag = tags[i];
                    if (isBotFilter) {
                        if (selectedLine === '원딜' || selectedLine === '바텀') {
                            if (tag === '원딜' || tag === '바텀' || tag === '서폿' || tag === '서포터') return true;
                        }
                        if (selectedLine === '서폿' || selectedLine === '서포터') {
                            if (tag === '서폿' || tag === '서포터' || tag === '원딜' || tag === '바텀') return true;
                        }
                    } else {
                        if (tag === selectedLine) return true;
                    }
                }

                return false;
            });

        function shouldShowCardBadge(rawName, activeLine) {
            if (!rawName) return false;
            if (typeof rawName === 'object' && rawName !== null) {
                rawName = rawName.name || '';
            }
            var parsed = getLineTagInfo(rawName);
            if (!parsed.iconUrl) return false;

            if (!activeLine || activeLine === '전체') {
                return true;
            }

            var tags = parsed.lineTags || [];
            if (!tags.length || tags.indexOf('기타') !== -1) {
                return false;
            }

            var isBotActive = (activeLine === '원딜' || activeLine === '바텀' || activeLine === '서폿' || activeLine === '서포터');

            var isPrimary = tags.some(function (tag) {
                if (isBotActive) {
                    return tag === '원딜' || tag === '바텀' || tag === '서폿' || tag === '서포터';
                }
                return tag === activeLine;
            });

            return !isPrimary;
        }

        (function () {
            var input = document.getElementById('champInput');
            var list = document.getElementById('autocompleteList');
            var acIdx = -1;  // 현재 키보드로 선택된 항목 인덱스

            /* 입력값에서 하이라이트 처리 */
            function highlight(text, rawQuery, convQuery) {
                if (!text) return '';
                var lower = text.toLowerCase();
                var targets = [rawQuery, convQuery].filter(Boolean);
                for (var i = 0; i < targets.length; i++) {
                    var q = targets[i];
                    if (!q) continue;
                    var idx = lower.indexOf(q.toLowerCase());
                    if (idx !== -1) {
                        return text.substring(0, idx)
                            + '<span class="ac-highlight">'
                            + text.substring(idx, idx + q.length)
                            + '</span>'
                            + text.substring(idx + q.length);
                    }
                }
                return text;
            }

            /* 드롭다운 닫기 */
            function closeList() {
                list.classList.remove('open');
                list.innerHTML = '';
                acIdx = -1;
            }

            /* active 항목 갱신 */
            function setActive(items, idx) {
                items.forEach(function (el, i) {
                    el.classList.toggle('ac-active', i === idx);
                });
                if (idx >= 0 && items[idx]) {
                    items[idx].scrollIntoView({ block: 'nearest' });
                }
            }

            /* 자동완성 목록 렌더링 */
            function renderAC(query) {
                if (!query) { closeList(); return; }
                var matches = searchChampions(query);
                if (!matches.length) { closeList(); return; }

                var rawQ = query.toLowerCase();
                var convQ = engToKor(query).toLowerCase();
                var results = matches.slice(0, 10);

                list.innerHTML = results.map(function (r, i) {
                    var cname = r.data.champion;
                    var dispName = (currentLang !== 'ko') ? (r.displayName || getChampDisplayName(cname)) : cname;
                    var urls = buildUrls(cname);
                    var urlsJson = JSON.stringify(urls).replace(/"/g, '&quot;');
                    return '<div class="ac-item" data-champion="' + cname.replace(/"/g, '&quot;') + '" data-display="' + dispName.replace(/"/g, '&quot;') + '" data-idx="' + i + '">'
                        + '<img class="ac-thumb" src="' + urls[0] + '" alt="' + dispName
                        + '" data-urls="' + urlsJson + '" data-url-idx="0" onerror="handleImgError(this)" />'
                        + '<div class="ac-thumb-fb">' + dispName.substring(0, 2) + '</div>'
                        + '<div><span class="ac-name">' + highlight(dispName, rawQ, convQ) + '</span></div>'
                        + '</div>';
                }).join('');

                list.classList.add('open');
                acIdx = -1;

                // 클릭 이벤트
                list.querySelectorAll('.ac-item').forEach(function (el) {
                    el.addEventListener('mousedown', function (e) {
                        e.preventDefault();  // blur 방지
                        var targetVal = el.getAttribute('data-display') || el.getAttribute('data-champion');
                        input.value = targetVal;
                        closeList();
                        search();
                    });
                });
            }

            /* 입력 이벤트 */
            input.addEventListener('input', function () {
                acIdx = -1;
                renderAC(this.value.trim());
            });

            /* 키보드 탐색 */
            input.addEventListener('keydown', function (e) {
                var items = list.querySelectorAll('.ac-item');
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (!list.classList.contains('open')) { renderAC(input.value.trim()); return; }
                    acIdx = Math.min(acIdx + 1, items.length - 1);
                    setActive(items, acIdx);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    acIdx = Math.max(acIdx - 1, -1);
                    setActive(items, acIdx);
                } else if (e.key === 'Enter') {
                    if (acIdx >= 0 && items[acIdx]) {
                        var targetVal = items[acIdx].getAttribute('data-display') || items[acIdx].getAttribute('data-champion');
                        input.value = targetVal;
                        closeList();
                    }
                    search();
                } else if (e.key === 'Escape') {
                    closeList();
                }
            });

            /* 포커스 아웃 시 닫기 */
            input.addEventListener('blur', function () {
                setTimeout(closeList, 150);
            });

            /* 포커스 인 시 다시 열기 */
            input.addEventListener('focus', function () {
                if (this.value.trim()) renderAC(this.value.trim());
            });
        })();

                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                statusMsg.innerText = '🎉 제보가 성공적으로 제출되었습니다! 감사합니다.';
                statusMsg.className = 'report-status-msg success';
                document.getElementById('reportContent').value = '';

                setTimeout(function () {
                    closeReportModal();
                }, 1800);
            } catch (err) {
                statusMsg.innerText = '전송 실패: ' + err.message;
                statusMsg.className = 'report-status-msg error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '제보 전송하기 🚀';
            }
        }
    </script>

    <!-- 챔피언 상성 제보 모달 팝업 -->
    <div id="reportModal" class="report-modal-overlay" onclick="handleModalOverlayClick(event)">
        <div class="report-modal-card">
            <div class="report-modal-header">
                <div class="report-modal-title">🚨 챔피언 상성 제보하기</div>
                <button type="button" class="report-modal-close" onclick="closeReportModal()">&times;</button>
            </div>
            <div class="report-modal-body">
                <!-- 1] 대상 챔피언 -->
                <div class="report-form-group">
                    <label class="report-form-label" for="reportTargetChamp">대상 챔피언</label>
                    <input type="text" id="reportTargetChamp" class="report-form-input"
                        placeholder="예: 아리, 스카너, 마오카이..." />
                </div>

                <!-- 2] 제보 내용 -->
                <div class="report-form-group">
                    <label class="report-form-label" for="reportContent">제보 내용</label>
                    <textarea id="reportContent" class="report-form-textarea" rows="8"
                        placeholder="카운터 정보, 시너지, 상대법 등 &#10;정해진 형식 없이 자유롭게 남겨주세요!"></textarea>
                </div>

                <!-- 상태 메시지 -->
                <div id="reportStatusMsg" class="report-status-msg"></div>
            </div>
            <div class="report-modal-footer">
                <button type="button" class="report-cancel-btn" onclick="closeReportModal()">취소</button>
                <button type="button" id="reportSubmitBtn" class="report-submit-btn" onclick="submitReport()">제보 전송하기
                    🚀</button>
            </div>
        </div>
    </div>
</body>

</html>
