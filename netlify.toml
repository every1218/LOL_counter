# ── Netlify 설정 ──────────────────────────────────────────
# 캐시 전략으로 대역폭(bandwidth) 소모를 최소화합니다.

# ── 빌드 설정 ──
[build]
  publish = "."

# ── 캐시 헤더 설정 ──────────────────────────────────────

# 1. 챔피언 이미지 (내용이 거의 바뀌지 않음 → 1년 캐시)
#    Cache-Control: public, max-age=31536000, immutable
#    → 브라우저가 1년간 서버 요청 없이 로컬 캐시 사용
[[headers]]
  for = "/champ_img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 2. 챔피언 데이터 JSON (가끔 업데이트됨 → 1일 캐시 + 재검증)
#    stale-while-revalidate: 캐시 만료 후에도 일단 캐시 반환하고 백그라운드에서 갱신
[[headers]]
  for = "/champ.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# 3. 아이콘 / 파비콘
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# 4. HTML 파일 (항상 최신 버전 → 캐시 안 함)
#    no-cache: 매번 서버에서 변경 여부 확인 (304 응답 시 본문 전송 없음)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# 5. 기타 정적 파일 (robots.txt, sitemap.xml 등 → 1일 캐시)
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
